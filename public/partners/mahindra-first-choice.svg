<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Centered Logo Group -->
  <g transform="translate(200, 150)">
    <!-- Mahindra Twin Peaks / Rise Wings Symbol -->
    <path d="M-55,-35 L-20,25 L-35,25 L-65,-15 Z" fill="url(#redGrad)"/>
    <path d="M55,-35 L20,25 L35,25 L65,-15 Z" fill="url(#redGrad)"/>
    <path d="M-15,10 L0,-25 L15,10 L0,30 Z" fill="url(#redGrad)"/>
  </g>

  <!-- Typography -->
  <text x="200" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#18181b" text-anchor="middle" letter-spacing="1">
    Mahindra
  </text>
  
  <text x="200" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#e11d48" text-anchor="middle" letter-spacing="0.5">
    FIRST CHOICE
  </text>

  <text x="200" y="295" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#71717a" text-anchor="middle" letter-spacing="3">
    SERVICES PVT. LTD.
  </text>

  <!-- Divider Line -->
  <line x1="80" y1="320" x2="320" y2="320" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Subtitle Tag -->
  <text x="200" y="345" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">
    INDIA'S TRUSTED CAR WORKSHOP NETWORK
  </text>
</svg>
